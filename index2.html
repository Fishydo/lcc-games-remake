<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCC Games Hub</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/search.css">
    <link rel="stylesheet" href="components/topbar.css">
    <link rel="stylesheet" href="styles/background.css">

    <style>
        html,
        body {
            height: 100%;
        }

        .home-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 96px 24px 56px;
            text-align: left;
            gap: 32px;
        }

        .site-title {
            font-size: 2.75rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            background: linear-gradient(120deg, #38bdf8 0%, #22d3ee 45%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .site-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            min-height: 24px;
        }

        .hero-grid {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
            gap: 24px;
            align-items: stretch;
        }

        .hero-card {
            background: linear-gradient(140deg, rgba(56, 189, 248, 0.08), rgba(167, 139, 250, 0.08));
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--shadow-lg);
        }

        .hero-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: rgba(56, 189, 248, 0.12);
            color: #bae6fd;
            margin-bottom: 16px;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .hero-actions a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .primary-action {
            background: linear-gradient(120deg, #38bdf8, #6366f1);
            color: #0f172a;
        }

        .secondary-action {
            border: 1px solid var(--border);
            color: var(--text);
            background: var(--surface);
        }

        .hero-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 24px;
        }

        .metric-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 16px;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Search Bar */
        .search-container {
            width: 100%;
            max-width: 720px;
            margin-bottom: 8px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 9999px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .search-bar:hover {
            background: var(--surface-hover);
        }

        .search-bar:focus-within {
            border-color: var(--text-muted);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .search-bar i {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 1rem;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        /* Featured Section */
        .featured-section {
            width: 100%;
            max-width: 960px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .star-icon {
            color: #fbbf24;
            font-size: 0.875rem;
        }

        .featured-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
        }

        .featured-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            color: var(--text);
        }

        .featured-card:hover {
            background: var(--surface-hover);
            border-color: var(--border-light);
            transform: translateY(-2px);
        }

        .featured-card-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.125rem;
            overflow: hidden;
        }

        .featured-card-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .featured-card-title {
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }





        @media (max-width: 960px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .site-title {
                font-size: 2rem;
            }

            .featured-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .hero-actions {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
    <script src="config.js"></script>
    <script src="scripts/settings.js"></script>
    <script src="scripts/background.js"></script>
    <script src="scripts/cloaking.js"></script>
    <script src="scripts/quotes.js"></script>
    <script src="scripts/notifications.js"></script>
    <script src="scripts/rotation.js"></script>
    <script src="scripts/featured.js"></script>
    <script src="components/UGSfiles.js"></script>
    <script src="scripts/gloader.js"></script>
    <script src="scripts/search.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js"></script>
    <script type="module">
        import * as BareMux from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs";
        window.BareMux = BareMux;
    </script>
</head>

<body>
    <div class="offline-banner" id="offline-banner">
        <i class="fa-solid fa-wifi-slash"></i>
        <span>You're offline</span>
    </div>

    <div class="home-page">
        <script src="components/topbar.js"></script>

        <main class="main-content">
            <div class="hero-grid">
                <section class="hero-card">
                    <div class="hero-pill"><i class="fa-solid fa-bolt"></i> LCC Games</div>
                    <h1 class="site-title">LCC Games Hub</h1>
                    <p class="site-subtitle" id="subtitle"></p>
                    <p class="text-sm">Your new launchpad for games, streaming, AI, and browser tools — reimagined with a sharper
                        look.</p>
                    <div class="hero-actions">
                        <a class="primary-action" href="pages/games.html"><i class="fa-solid fa-gamepad"></i> Explore Games</a>
                        <a class="secondary-action" href="pages/music.html"><i class="fa-solid fa-music"></i> Open Music</a>
                    </div>
                    <div class="hero-metrics">
                        <div class="metric-card">
                            <div class="metric-label">Theme</div>
                            <div class="metric-value">LCC Neon</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">Status</div>
                            <div class="metric-value">All Systems Ready</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">Shortcuts</div>
                            <div class="metric-value">10+ Quick Links</div>
                        </div>
                    </div>
                </section>

            </div>

            <!-- Search Bar -->
            <div class="search-container">
                <form class="search-bar" onsubmit="handleSearch(event)">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search the web and games..." autocomplete="off">
                </form>
            </div>

            <!-- Featured -->
            <section class="featured-section">
                <div class="section-header">
                    <i class="fa-solid fa-star star-icon"></i>
                    <span class="section-title">Featured</span>
                </div>
                <div class="featured-grid" id="featured-grid"></div>
            </section>
        </main>

    </div>


    <script>


        // Featured games
        (async () => {
            await window.FeaturedGames.load();
            const featuredGames = window.FeaturedGames.games || [];

            const grid = document.getElementById('featured-grid');
            if (!grid) return;

            const fragment = document.createDocumentFragment();
            featuredGames.forEach(g => {
                const card = document.createElement('a');
                card.href = g.url;
                card.className = 'featured-card';
                card.innerHTML = `
                    <div class="featured-card-icon" style="background: ${g.gameName ? 'transparent' : 'var(--surface-hover)'}; color: var(--text-muted);">
                        ${g.img ? `<img src="${g.img}" loading="eager" onerror="this.parentElement.innerHTML='<i class=\\'fa-solid fa-gamepad\\'></i>'">` : `<i class="${g.icon}"></i>`}
                    </div>
                    <div class="featured-card-title">${g.name}</div>
                `;
                fragment.appendChild(card);
            });
            grid.appendChild(fragment);
        })();

        // Music widget
        (() => {
            const playlist = [
                {
                    title: 'Skyline Drift',
                    artist: 'LCC Sound',
                    src: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_6f3297f0d1.mp3?filename=chill-ambient-11099.mp3',
                    cover: 'https://images.unsplash.com/photo-1485579149621-3123dd979885?q=80&w=1200&auto=format&fit=crop'
                },
                {
                    title: 'Arcade Pulse',
                    artist: 'Night Grid',
                    src: 'https://cdn.pixabay.com/download/audio/2022/10/30/audio_fa6cefe804.mp3?filename=cyberpunk-ambient-121317.mp3',
                    cover: 'https://images.unsplash.com/photo-1520975682031-44f04d2dc5b7?q=80&w=1200&auto=format&fit=crop'
                },
                {
                    title: 'Afterglow',
                    artist: 'Neon Vista',
                    src: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_c32b602ac1.mp3?filename=ambient-10961.mp3',
                    cover: 'https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?q=80&w=1200&auto=format&fit=crop'
                }
            ];

            const audio = document.getElementById('music-audio');
            const playBtn = document.getElementById('music-play');
            const prevBtn = document.getElementById('music-prev');
            const nextBtn = document.getElementById('music-next');
            const titleEl = document.getElementById('music-title');
            const artistEl = document.getElementById('music-artist');
            const coverEl = document.getElementById('music-cover');
            const progress = document.getElementById('music-progress');
            const progressBar = document.getElementById('music-progress-bar');
            const currentTimeEl = document.getElementById('music-current');
            const durationEl = document.getElementById('music-duration');
            const queueEl = document.getElementById('music-queue');

            if (!audio || !playBtn || !queueEl) return;

            let currentIndex = 0;
            let isPlaying = false;

            const formatTime = (time) => {
                if (!Number.isFinite(time)) return '0:00';
                const minutes = Math.floor(time / 60);
                const seconds = Math.floor(time % 60).toString().padStart(2, '0');
                return `${minutes}:${seconds}`;
            };

            const renderQueue = () => {
                queueEl.innerHTML = '';
                playlist.forEach((track, index) => {
                    const item = document.createElement('div');
                    item.className = 'music-queue-item' + (index === currentIndex ? ' active' : '');
                    item.innerHTML = `<span>${track.title}</span><span>${track.artist}</span>`;
                    item.onclick = () => {
                        loadTrack(index);
                        playTrack();
                    };
                    queueEl.appendChild(item);
                });
            };

            const loadTrack = (index) => {
                const track = playlist[index];
                if (!track) return;
                currentIndex = index;
                titleEl.textContent = track.title;
                artistEl.textContent = track.artist;
                coverEl.src = track.cover;
                audio.src = track.src;
                progressBar.style.width = '0%';
                currentTimeEl.textContent = '0:00';
                durationEl.textContent = '0:00';
                renderQueue();
            };

            const playTrack = async () => {
                try {
                    await audio.play();
                    isPlaying = true;
                    playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                } catch (e) {
                    console.warn('Unable to play audio', e);
                }
            };

            const pauseTrack = () => {
                audio.pause();
                isPlaying = false;
                playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            };

            const nextTrack = () => {
                currentIndex = (currentIndex + 1) % playlist.length;
                loadTrack(currentIndex);
                playTrack();
            };

            const prevTrack = () => {
                currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                loadTrack(currentIndex);
                playTrack();
            };

            playBtn.addEventListener('click', () => {
                if (isPlaying) pauseTrack();
                else playTrack();
            });

            prevBtn?.addEventListener('click', prevTrack);
            nextBtn?.addEventListener('click', nextTrack);

            audio.addEventListener('timeupdate', () => {
                const progressValue = (audio.currentTime / (audio.duration || 1)) * 100;
                progressBar.style.width = `${progressValue}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            });

            audio.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(audio.duration);
            });

            audio.addEventListener('ended', nextTrack);

            audio.addEventListener('error', () => {
                titleEl.textContent = 'Track unavailable';
                artistEl.textContent = 'Choose another track';
                pauseTrack();
            });

            progress.addEventListener('click', (e) => {
                if (!Number.isFinite(audio.duration)) return;
                const rect = progress.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audio.currentTime = percent * audio.duration;
            });

            loadTrack(currentIndex);
            renderQueue();
        })();


        // Theme notification
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (window.Notify) {
                    window.Notify.info("Appearance", "Don't like your theme? Change it in settings!", 6000);
                }
            }, 1500);
        });
    </script>

    <script src="components/footer.js"></script>
    <script src="scripts/init.js"></script>
</body>

</html>
