<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LCC Games Hub</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/search.css" />
    <link rel="stylesheet" href="components/topbar.css" />
    <link rel="stylesheet" href="styles/background.css" />

    <style>
        html, body {
            height: 100%;
        }

        .home-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 96px 24px 56px;
            gap: 32px;
        }

        .site-title {
            font-size: 2.75rem;
            font-weight: 700;
            background: linear-gradient(120deg, #38bdf8, #22d3ee, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-grid {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 24px;
        }

        .hero-card {
            background: linear-gradient(140deg, rgba(56,189,248,.08), rgba(167,139,250,.08));
            border: 1px solid rgba(148,163,184,.2);
            border-radius: 24px;
            padding: 28px;
        }

        /* MUSIC WIDGET */

        .music-widget {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .music-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .music-label {
            font-size: .7rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .music-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .music-artist {
            font-size: .9rem;
            color: var(--text-muted);
        }

        .music-open {
            border: 1px solid var(--border);
            background: var(--surface-hover);
            border-radius: 999px;
            padding: 6px 12px;
            cursor: pointer;
        }

        .music-art {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            overflow: hidden;
        }

        .music-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .music-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .music-control-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface-hover);
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        .music-control-btn.play {
            width: 48px;
            height: 48px;
            background: linear-gradient(120deg, #38bdf8, #818cf8);
            border: none;
            color: #0f172a;
        }

        .music-progress {
            height: 6px;
            background: rgba(148,163,184,.2);
            border-radius: 999px;
            overflow: hidden;
            cursor: pointer;
        }

        .music-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(120deg, #38bdf8, #a78bfa);
        }

        .music-timestamps {
            display: flex;
            justify-content: space-between;
            font-size: .75rem;
            color: var(--text-muted);
        }

        .music-queue {
            display: grid;
            gap: 8px;
        }

        .music-queue-item {
            padding: 8px 12px;
            border-radius: 12px;
            background: var(--surface-hover);
            cursor: pointer;
            font-size: .85rem;
            display: flex;
            justify-content: space-between;
        }

        .music-queue-item.active {
            border: 1px solid rgba(56,189,248,.6);
            background: rgba(56,189,248,.12);
        }

        @media (max-width: 960px) {
            .hero-grid { grid-template-columns: 1fr; }
        }
    </style>

    <script src="config.js"></script>
    <script src="scripts/settings.js"></script>
    <script src="scripts/background.js"></script>
    <script src="scripts/featured.js"></script>
</head>

<body>
<div class="home-page">
    <script src="components/topbar.js"></script>

    <main class="main-content">
        <div class="hero-grid">
            <section class="hero-card">
                <h1 class="site-title">LCC Games Hub</h1>
                <p>Your launchpad for games, music, and tools.</p>
            </section>

            <section class="music-widget">
                <div class="music-header">
                    <div>
                        <div class="music-label">Now Playing</div>
                        <div class="music-title" id="music-title">Loading</div>
                        <div class="music-artist" id="music-artist">—</div>
                    </div>
                    <button class="music-open" onclick="location.href='pages/music.html'">Full player</button>
                </div>

                <div class="music-art">
                    <img id="music-cover" alt="Album cover">
                </div>

                <div class="music-controls">
                    <button id="music-prev" class="music-control-btn"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="music-play" class="music-control-btn play"><i class="fa-solid fa-play"></i></button>
                    <button id="music-next" class="music-control-btn"><i class="fa-solid fa-forward-step"></i></button>
                </div>

                <div class="music-progress" id="music-progress">
                    <div class="music-progress-bar" id="music-progress-bar"></div>
                </div>

                <div class="music-timestamps">
                    <span id="music-current">0:00</span>
                    <span id="music-duration">0:00</span>
                </div>

                <div class="music-queue" id="music-queue"></div>
                <audio id="music-audio"></audio>
            </section>
        </div>
    </main>
</div>

<script src="scripts/init.js"></script>
</body>
</html>
