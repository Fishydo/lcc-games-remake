<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCC Games Hub</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/search.css">
    <link rel="stylesheet" href="components/topbar.css">
    <link rel="stylesheet" href="styles/background.css">

    <style>
        html,
        body {
            height: 100%;
        }

        .home-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .home-page::before {
            content: "";
            position: absolute;
            inset: -20% -10% auto -10%;
            height: 420px;
            background:
                radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.18), transparent 55%),
                radial-gradient(circle at 80% 10%, rgba(129, 140, 248, 0.18), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 96px 24px 56px;
            gap: 32px;
        }

        .site-title {
            font-size: 2.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(120deg, #38bdf8 0%, #22d3ee 45%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .site-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            min-height: 24px;
        }

        .hero-grid {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
            gap: 24px;
        }

        .hero-card {
            background: linear-gradient(140deg, rgba(56, 189, 248, 0.08), rgba(167, 139, 250, 0.08));
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--shadow-lg);
        }

        .hero-pill {
            display: inline-flex;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.12);
            color: #bae6fd;
            margin-bottom: 16px;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .primary-action {
            background: linear-gradient(120deg, #38bdf8, #6366f1);
            color: #0f172a;
        }

        .secondary-action {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .hero-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 24px;
        }

        .metric-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 16px;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* 🔧 FIXED BROKEN RULE */
        .search-bar:hover {
            background: var(--surface-hover);
        }

        .search-bar:focus-within {
            border-color: var(--text-muted);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .featured-section {
            width: 100%;
            max-width: 960px;
        }

        .featured-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
        }

        .featured-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 10px;
            text-align: center;
            text-decoration: none;
            color: var(--text);
            transition: transform 0.15s;
        }

        .featured-card:hover {
            transform: translateY(-2px);
            background: var(--surface-hover);
        }

        @media (max-width: 960px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .site-title {
                font-size: 2rem;
            }

            .hero-actions {
                flex-direction: column;
            }
        }
    </style>

    <script src="config.js"></script>
    <script src="scripts/settings.js"></script>
    <script src="scripts/background.js"></script>
    <script src="scripts/cloaking.js"></script>
    <script src="scripts/quotes.js"></script>
    <script src="scripts/notifications.js"></script>
    <script src="scripts/rotation.js"></script>
    <script src="scripts/featured.js"></script>
    <script src="components/UGSfiles.js"></script>
    <script src="scripts/gloader.js"></script>
    <script src="scripts/search.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js"></script>

    <script type="module">
        import * as BareMux from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs";
        window.BareMux = BareMux;
    </script>
</head>

<body>

    <div class="home-page">
        <script src="components/topbar.js"></script>

        <main class="main-content">
            <div class="hero-grid">

                <section class="hero-card">
                    <div class="hero-pill"><i class="fa-solid fa-bolt"></i> LCC Games</div>
                    <h1 class="site-title">LCC Games Hub</h1>
                    <p class="site-subtitle" id="subtitle"></p>
                    <p>Your new launchpad for games, streaming, AI, and browser tools.</p>

                    <div class="hero-actions">
                        <a class="primary-action" href="pages/games.html">
                            <i class="fa-solid fa-gamepad"></i> Explore Games
                        </a>
                        <a class="secondary-action" href="pages/music.html">
                            <i class="fa-solid fa-music"></i> Open Music
                        </a>
                    </div>

                    <div class="hero-metrics">
                        <div class="metric-card">
                            <div class="metric-label">Theme</div>
                            <div class="metric-value">LCC Neon</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">Status</div>
                            <div class="metric-value">All Systems Ready</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">Shortcuts</div>
                            <div class="metric-value">10+ Quick Links</div>
                        </div>
                    </div>
                </section>

                <!-- 🎵 MUSIC WIDGET (MERGED) -->
                <section class="music-widget" aria-label="Music player widget">
                    <div class="music-header">
                        <div>
                            <div class="music-label">Now playing</div>
                            <div id="music-title">Loading track</div>
                            <div id="music-artist">Loading artist</div>
                        </div>
                        <button onclick="location.href='pages/music.html'">Full player</button>
                    </div>
                    <audio id="music-audio"></audio>
                </section>

            </div>

            <section class="featured-section">
                <div class="featured-grid" id="featured-grid"></div>
            </section>
        </main>
    </div>

    <script src="components/footer.js"></script>
    <script src="scripts/init.js"></script>

</body>
</html>
